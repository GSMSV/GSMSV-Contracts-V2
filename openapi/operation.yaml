openapi: 3.1.0
info:
  title: GSMSV v2 Operation API
  version: 0.1.0
  description: |
    오래 걸리는 작업(operation)의 상태 조회와 진행 알림 (C7). DB 발급·삭제, 백업 복원처럼 요청을 받은 뒤 뒤에서 이어지는 일을 다룬다.

    - 요청을 받은 API는 일이 끝나기 전에도 항상 `202`와 `{ operation, resource }`로 답한다 (`201`·`200`으로 바꾸지 않는다). 이 파일은 그 뒤에 진행 상태를 묻고 받는 방법을 정한다
    - JSON 칸 이름은 snake_case, enum 값은 소문자다
    - 오류 본문은 공통 형식 `{ code, message, request_id, details? }`다 ([공통 컴포넌트](./components/common.yaml))
    - 진행 상태의 원본은 Server DB다. Infra(Go)의 작업 기록은 메모리에만 있고 Server가 물어서 맞춘다 ([내부 API 규약 4.2](../rules/internal-api-rules.md), [경계 6.1](../policies/kotlin-go-boundary.md#61-오래-걸리는-작업))
    - operation은 서비스 자원도 하위 자원도 아니다. GRN이 없고 `op-…` id만 가진다 ([상수 값](../constants/resource-id.md)). 그래도 **id만 알면 볼 수 있는 값이 아니다**: 읽을 수 있는지는 operation에 저장된 대상 자원으로 판단한다 (아래 권한)
    - 취소·재시도 API는 이 파일에 없다. 필요한 기능이 생기면 그 기능 명세에서 더한다

    operation의 상태 값

    | `status` | 뜻 |
    |---|---|
    | `queued` | 접수했고 아직 시작하지 않았다. `queue_position`이 앞에 기다리는 작업 수다 |
    | `running` | 하는 중이다 |
    | `succeeded` | 끝났다 (종료 상태) |
    | `failed` | 실패했다. `error`가 채워진다 (종료 상태) |
    | `canceled` | 취소됐다 (종료 상태) |

    `stage`는 `running` 안에서의 진행 단계다. 단계가 없는 작업은 `queued` 다음에 `running`을 쓴다. 끝난 뒤에도 마지막 단계를 그대로 둔다.

    | 작업 | `stage`가 거치는 값 |
    |---|---|
    | VM 만들기 (`vm.create`) | `queued` → `cloning` → `configuring` → `booting` → `networking` (화면 문구는 [기능별 정책](../policies/feature-policies.md)의 단계와 하나씩 맞는다) |
    | 그 밖의 작업 | `queued` → `running` |

    권한

    - 읽는 권한은 **대상 자원의 조회 권한**과 같다. 대상을 볼 수 있으면 그 operation도 볼 수 있다 (개인 자원은 본인, 팀 자원은 그 팀 구성원, 관리자는 모두)
    - 볼 수 없거나 없는 operation은 둘을 구분하지 않고 404다. 다른 사람의 operation id를 알아도 존재 여부가 드러나지 않는다
    - 대상이 사라진 뒤의 조회 (**제안**): 삭제 작업(`*.delete`)이 끝나면 대상 자원이 로더에서 보이지 않으므로, 그 operation은 **요청한 사용자와 관리자**만 계속 볼 수 있다
    - 권한 판단은 자원 로더 한 곳에서 한다 ([22번](../rules/authorization.md)). operation 조회도 저장된 대상 자원을 로더에 넣어 판단하고, 요청 경로의 id만으로 판단하지 않는다

    미정

    - **(미정)** 끝난 operation을 남겨 두는 기간. 지금은 조회가 가능한 동안 지우지 않는다
    - **(미정)** SSE 하트비트 간격. 아래 15초는 제안 값이고 설정값으로 둔다
servers:
  - url: https://{host}
    variables:
      host:
        default: example.com
security:
  - accessToken: []
tags:
  - name: Operation
    description: 오래 걸리는 작업의 상태 조회와 진행 알림
paths:
  /api/v2/operations/{operation_id}:
    parameters:
      - $ref: '#/components/parameters/OperationId'
    get:
      tags: [Operation]
      operationId: getOperation
      summary: 작업 상태 조회 (0.1)
      description: |
        operation 하나의 지금 상태를 준다. 폴링으로 진행을 볼 때 쓴다. 끝난 뒤에도 같은 값을 계속 준다.

        - 폴링 간격은 화면이 정한다. 진행을 바로 보여 주려면 아래 SSE를 쓴다
        - 값은 Server DB에서 읽는다. 진행 단계는 Infra가 보고한 마지막 값이라 몇 초 늦을 수 있다

        권한: 대상 자원의 조회 권한 (위 설명 참고)
      responses:
        '200':
          description: operation의 지금 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              examples:
                running:
                  summary: 만드는 중인 DB
                  value:
                    id: op-4p8w2k9m1xza
                    type: db.create
                    status: running
                    stage: running
                    queue_position: 0
                    resource:
                      type: db
                      grn: grn:user-aaaaaaaaaaaa:db-k3m9x2p7q4ta
                    created_at: '2026-11-14T09:00:00Z'
                    updated_at: '2026-11-14T09:00:02Z'
                    finished_at: null
                    error: null
                failed:
                  summary: 실패한 작업
                  value:
                    id: op-7c3v5b9n2xqe
                    type: db.create
                    status: failed
                    stage: running
                    queue_position: 0
                    resource:
                      type: db
                      grn: grn:user-aaaaaaaaaaaa:db-m4q8w2x6k9ta
                    created_at: '2026-11-14T09:10:00Z'
                    updated_at: '2026-11-14T09:10:05Z'
                    finished_at: '2026-11-14T09:10:05Z'
                    error:
                      code: UPSTREAM_UNAVAILABLE
                      message: 데이터베이스 서버가 응답하지 않아 만들지 못했습니다.
                      details: {}
        '400':
          $ref: './components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
  /api/v2/operations/{operation_id}/events:
    parameters:
      - $ref: '#/components/parameters/OperationId'
    get:
      tags: [Operation]
      operationId: streamOperationEvents
      summary: 작업 진행 알림 (SSE) (0.2)
      description: |
        operation의 상태가 바뀔 때마다 SSE(`text/event-stream`)로 알린다. 브라우저의 `EventSource`로 받는다.
        `EventSource`는 `Authorization` 헤더를 보낼 수 없으므로 **쿠키 인증**을 쓴다 ([공통 컴포넌트](./components/common.yaml)의 `accessToken`).

        - **이벤트는 차이가 아니라 그 시점의 전체 상태다.** 모든 이벤트의 `data`는 `Operation` 전체다. 받는 쪽은 앞 이벤트를 합치지 않고 마지막 값으로 덮어쓴다
        - 연결하면 먼저 **지금 상태를 한 번** 보낸다. 그 뒤에는 `status`·`stage`·`queue_position`이 바뀔 때마다 보낸다
        - 종료 상태(`succeeded`·`failed`·`canceled`)를 보낸 뒤 서버가 연결을 닫는다. 이미 끝난 operation에 연결해도 상태를 한 번 보내고 닫는다
        - 연결이 끊기면 `EventSource`가 자동으로 다시 연결한다. 다시 연결해도 지금 상태를 처음에 한 번 보내므로 놓친 이벤트를 따로 되감지 않는다 (`Last-Event-ID`를 쓰지 않는다)
        - 15초(**제안**) 동안 보낼 이벤트가 없으면 `: keep-alive` 주석 줄을 보내 연결을 유지한다
        - 연결을 열 때만 권한을 판단한다. 연결 중에 권한이 사라져도 그 연결은 끊지 않는다 (**제안**)

        이벤트 형식

        ```text
        id: 3
        event: operation
        data: {"id":"op-4p8w2k9m1xza","type":"db.create","status":"succeeded", ...}

        ```

        - `id`는 그 operation 안에서 1부터 커지는 번호다. 화면이 순서를 확인하는 데만 쓴다
        - `event`는 항상 `operation`이다

        권한: 대상 자원의 조회 권한 (연결을 열 때)
      responses:
        '200':
          description: 이벤트 스트림
          content:
            text/event-stream:
              schema:
                type: string
                description: 위 이벤트 형식의 텍스트 스트림. `data`는 `Operation`의 JSON이다
              example: |
                id: 1
                event: operation
                data: {"id":"op-4p8w2k9m1xza","type":"db.create","status":"running","stage":"running","queue_position":0,"resource":{"type":"db","grn":"grn:user-aaaaaaaaaaaa:db-k3m9x2p7q4ta"},"created_at":"2026-11-14T09:00:00Z","updated_at":"2026-11-14T09:00:02Z","finished_at":null,"error":null}

                : keep-alive

                id: 2
                event: operation
                data: {"id":"op-4p8w2k9m1xza","type":"db.create","status":"succeeded","stage":"running","queue_position":0,"resource":{"type":"db","grn":"grn:user-aaaaaaaaaaaa:db-k3m9x2p7q4ta"},"created_at":"2026-11-14T09:00:00Z","updated_at":"2026-11-14T09:00:09Z","finished_at":"2026-11-14T09:00:09Z","error":null}
        '400':
          $ref: './components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
components:
  parameters:
    OperationId:
      name: operation_id
      in: path
      required: true
      description: operation id. 형식이 틀리면 400 `INVALID_RESOURCE_ID`다 ([상수 값](../constants/resource-id.md))
      schema:
        type: string
        pattern: '^op-[0-9a-hjkmnp-tv-z]{12}$'
      example: op-4p8w2k9m1xza
  schemas:
    OperationStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
    OperationStage:
      type: [string, 'null']
      enum: [queued, running, cloning, configuring, booting, networking, null]
      description: |
        진행 단계. 단계를 나누지 않는 작업은 `queued`, `running`만 쓴다. `cloning`·`configuring`·`booting`·`networking`은 VM 만들기만 쓴다.
        끝난 뒤에도 마지막 단계를 그대로 둔다
    OperationRef:
      type: object
      description: |
        `202` 응답이 싣는 operation의 최소 표시 필드. 값의 뜻은 `Operation`과 같다.
        `GET /api/v2/operations/{operation_id}`로 나머지 값을 받는다
      required: [id, type, status, stage]
      properties:
        id:
          type: string
          pattern: '^op-[0-9a-hjkmnp-tv-z]{12}$'
        type:
          type: string
        status:
          $ref: '#/components/schemas/OperationStatus'
        stage:
          $ref: '#/components/schemas/OperationStage'
    OperationResource:
      type: object
      description: 작업 대상 자원. 응답에는 노드·VM 번호 같은 구현 값을 넣지 않는다
      required: [type, grn]
      properties:
        type:
          type: string
          enum: [vm, fn, db, app]
          description: 서비스 자원 종류 (GRN의 자원 접두사와 같다). 백업 복원처럼 하위 자원에 하는 작업도 그 부모 서비스 자원을 가리킨다
        grn:
          type: string
          description: 대상 서비스 자원의 GRN
    OperationError:
      type: object
      description: 실패 원인. 오류 응답 본문과 같은 `code`·`message`·`details`다. 요청자가 보내지 않은 다른 자원의 존재나 id를 넣지 않는다
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
          description: 사람이 읽는 한국어 설명
        details:
          type: object
          additionalProperties: true
    Operation:
      type: object
      required: [id, type, status, stage, queue_position, resource, created_at, updated_at, finished_at, error]
      properties:
        id:
          type: string
          pattern: '^op-[0-9a-hjkmnp-tv-z]{12}$'
        type:
          type: string
          pattern: '^[a-z]+\.[a-z_]+$'
          description: |
            작업 종류. 앞부분은 대상 자원의 접두사와 같고 권한 판단의 동작 이름과 짝이 맞는다 (예: `db.create`, `db.delete`, `backup.restore`).
            값은 작업을 시작하는 기능의 명세가 정한다
        status:
          $ref: '#/components/schemas/OperationStatus'
        stage:
          $ref: '#/components/schemas/OperationStage'
        queue_position:
          type: integer
          minimum: 0
          description: '`queued`일 때 앞에 기다리는 작업 수. 그 밖에는 0'
        resource:
          $ref: '#/components/schemas/OperationResource'
        created_at:
          type: string
          format: date-time
          description: 요청을 접수한 시각
        updated_at:
          type: string
          format: date-time
          description: '`status`·`stage`·`queue_position`이 마지막으로 바뀐 시각'
        finished_at:
          type: [string, 'null']
          format: date-time
          description: 종료 상태가 된 시각. 끝나지 않았으면 `null`
        error:
          oneOf:
            - $ref: '#/components/schemas/OperationError'
            - type: 'null'
          description: '`failed`일 때만 채운다. 그 밖에는 `null`'
