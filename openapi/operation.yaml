openapi: 3.1.0
info:
  title: GSMSV v2 Operation API
  version: 0.1.0
  description: |
    오래 걸리는 작업(operation)의 상태 조회와 진행 스트림(SSE).

    - VM·데이터베이스·앱 만들기처럼 오래 걸리는 요청은 끝날 때까지 기다리지 않고 `202` + `{ operation, resource }`로 바로 답한다.
      화면은 그 뒤 이 API로 진행 상태를 받는다
    - 규칙의 원본은 [Kotlin·Go 경계 6.1·7.5](../policies/kotlin-go-boundary.md), [기능 정책](../policies/feature-policies.md)(생성 진행 표시는 단계 방식)이다
    - **진실은 Server DB에 있다.** Server가 Infra 작업(`internal.yaml`의 `Job`)을 폴링해 operation을 갱신한다.
      Infra의 `job_id`는 사용자에게 보이지 않는다. 사용자에게 보이는 작업 id는 operation id(`op-…`)뿐이다 ([내부 API 공통 규약 2장](../rules/internal-api-rules.md))
    - JSON 칸 이름은 snake_case, 상태·단계 값은 소문자다
    - 오류 본문은 공통 형식 `{ code, message, request_id, details? }`다
servers:
  - url: https://{host}
    variables:
      host:
        default: example.com
security:
  - accessToken: []
tags:
  - name: Operation
    description: 오래 걸리는 작업의 상태
paths:
  /api/v2/operations/{operation_id}:
    parameters:
      - $ref: '#/components/parameters/OperationId'
    get:
      tags: [Operation]
      operationId: getOperation
      summary: 작업 상태 조회
      description: |
        operation 하나의 지금 상태를 준다. 화면이 SSE를 못 쓰거나, 다시 열었을 때 현재 상태를 한 번 받는 데 쓴다.

        권한: 대상 자원(`resource`)의 조회 권한. operation에는 따로 권한이 없다
        - Server는 operation을 찾은 뒤 대상 자원을 자원 로더에 통과시켜 판단한다
        - operation이 없거나, 대상 자원을 볼 수 없으면 똑같이 404 `RESOURCE_NOT_FOUND`다. 둘을 구분하지 않는다
        - 삭제가 끝난 자원의 operation(예 `vm.delete` 성공)도 보관 기간 동안은 삭제 전 소유자 기준으로 같은 규칙표로 판단한다
      responses:
        '200':
          description: 작업 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              examples:
                queued:
                  summary: 대기 중 (앞에 2개)
                  value:
                    id: op-7w8k9q0p1a2s
                    type: vm.create
                    resource: { grn: 'grn:team-4p8w2k9m1xza:vm-k3m9x2p7q4ta' }
                    status: queued
                    stage: queued
                    queue_position: 2
                    error: null
                    created_at: '2026-11-12T09:00:00Z'
                    updated_at: '2026-11-12T09:00:00Z'
                    finished_at: null
                running:
                  summary: 복제 중
                  value:
                    id: op-7w8k9q0p1a2s
                    type: vm.create
                    resource: { grn: 'grn:team-4p8w2k9m1xza:vm-k3m9x2p7q4ta' }
                    status: running
                    stage: cloning
                    queue_position: 0
                    error: null
                    created_at: '2026-11-12T09:00:00Z'
                    updated_at: '2026-11-12T09:00:20Z'
                    finished_at: null
                failed:
                  summary: 복제 단계에서 실패
                  value:
                    id: op-7w8k9q0p1a2s
                    type: vm.create
                    resource: { grn: 'grn:team-4p8w2k9m1xza:vm-k3m9x2p7q4ta' }
                    status: failed
                    stage: cloning
                    queue_position: 0
                    error:
                      code: VM_CREATE_FAILED
                      message: VM 복제 중 문제가 생겼습니다. 잠시 뒤 다시 시도해 주세요.
                      retryable: true
                    created_at: '2026-11-12T09:00:00Z'
                    updated_at: '2026-11-12T09:01:05Z'
                    finished_at: '2026-11-12T09:01:05Z'
        '400':
          $ref: './components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
  /api/v2/operations/{operation_id}/events:
    parameters:
      - $ref: '#/components/parameters/OperationId'
    get:
      tags: [Operation]
      operationId: streamOperationEvents
      summary: 작업 진행 스트림 (SSE)
      description: |
        operation의 상태가 바뀔 때마다 Server-Sent Events로 보낸다. 권한은 `GET /api/v2/operations/{operation_id}`와 같다.
        권한 판단과 형식 검사는 스트림을 열기 전에 한다. 실패하면 SSE가 아니라 일반 JSON 오류(400·401·404)로 답한다.

        이벤트
        - `event: operation`: `data`는 그 시점의 `Operation` 전체(JSON 한 줄)다. 차이만 보내지 않는다
        - 연결하자마자 지금 상태를 한 번 보낸다. 그 뒤 `status`·`stage`·`queue_position`이 바뀔 때마다 보낸다
        - 끝난 상태(`succeeded`·`failed`·`canceled`)를 보낸 뒤 Server가 연결을 닫는다. 이미 끝난 operation이면 한 번 보내고 바로 닫는다
        - 연결을 유지하려고 15초마다 주석 줄(`: ping`)을 보낸다. 화면은 무시한다

        다시 연결
        - 매번 전체 상태를 보내므로 `Last-Event-ID`는 쓰지 않는다. 끊기면 다시 연결해 첫 이벤트로 지금 상태를 받는다
        - 브라우저 `EventSource`는 헤더를 못 붙이므로 `access_token` 쿠키로 인증한다 (같은 사이트 요청)
      responses:
        '200':
          description: 진행 스트림
          content:
            text/event-stream:
              schema:
                type: string
                description: '`event: operation` 이벤트의 `data`는 `#/components/schemas/Operation`이다'
              example: |
                event: operation
                data: {"id":"op-7w8k9q0p1a2s","type":"vm.create","resource":{"grn":"grn:team-4p8w2k9m1xza:vm-k3m9x2p7q4ta"},"status":"running","stage":"cloning","queue_position":0,"error":null,"created_at":"2026-11-12T09:00:00Z","updated_at":"2026-11-12T09:00:20Z","finished_at":null}

                : ping

                event: operation
                data: {"id":"op-7w8k9q0p1a2s","type":"vm.create","resource":{"grn":"grn:team-4p8w2k9m1xza:vm-k3m9x2p7q4ta"},"status":"succeeded","stage":"networking","queue_position":0,"error":null,"created_at":"2026-11-12T09:00:00Z","updated_at":"2026-11-12T09:02:10Z","finished_at":"2026-11-12T09:02:10Z"}
        '400':
          $ref: './components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
components:
  securitySchemes:
    accessToken:
      $ref: './components/common.yaml#/components/securitySchemes/accessToken'
  parameters:
    OperationId:
      name: operation_id
      in: path
      required: true
      description: operation id. 형식이 틀리면 400 `INVALID_RESOURCE_ID`다 ([상수 값](../constants/resource-id.md))
      schema:
        type: string
        pattern: '^op-[0-9a-hjkmnp-tv-z]{12}$'
      example: op-7w8k9q0p1a2s
  schemas:
    OperationStatus:
      type: string
      description: |
        Infra `JobStatus`와 같은 값이다.
        `queued`·`running`은 진행 중, `succeeded`·`failed`·`canceled`는 끝난 상태이고 다시 바뀌지 않는다
      enum: [queued, running, succeeded, failed, canceled]
    OperationStage:
      type: string
      description: |
        지금 단계. 끝난 operation은 마지막 단계를 그대로 둔다 (실패했으면 실패한 단계).
        - `vm.create`: `queued` → `cloning` → `configuring` → `booting` → `networking`
        - 그 밖의 작업: `queued` → `running`
        - 다른 작업 종류에 단계를 더하려면 이 `enum`과 그 자원의 명세를 함께 고친다. 목록에 없는 값은 보내지 않는다
      enum: [queued, cloning, configuring, booting, networking, running]
    OperationType:
      type: string
      description: |
        작업 종류. 앞부분은 대상 자원의 접두사와 같다. Infra `Job.type`과 같은 이름을 쓴다.
        지금 쓰는 값: `vm.create`, `vm.delete`, `vm.power`, `vm.resize`, `snap.create`, `snap.delete`, `snap.restore`,
        `db.create`, `db.delete`, `backup.restore`, `app.create`, `app.delete`
      examples: [vm.create, db.create, backup.restore]
    OperationError:
      type: object
      required: [code, message, retryable]
      description: |
        실패 원인. Infra `JobError`를 Server가 사용자용으로 바꾼 것이다.
        Infra의 원래 code와 `details`(VM 번호, 노드 등 구현 값)는 넣지 않는다 ([API 규칙 2.2](../rules/api-rules.md))
      properties:
        code:
          type: string
          description: 오류 종류. 대문자와 밑줄
        message:
          type: string
          description: 사람이 읽는 한국어 설명. 화면에 그대로 보여도 된다
        retryable:
          type: boolean
          description: 같은 요청을 다시 보내면 될 수도 있는지. 화면이 "다시 시도" 버튼을 보일지 정하는 데 쓴다
    Operation:
      type: object
      required: [id, type, resource, status, stage, queue_position, error, created_at, updated_at, finished_at]
      description: '`status`가 `failed`이면 `error`는 `OperationError`, 그 밖에는 null이다'
      oneOf:
        - properties:
            status: { const: failed }
            error:
              $ref: '#/components/schemas/OperationError'
        - properties:
            status: { enum: [queued, running, succeeded, canceled] }
            error:
              type: 'null'
      properties:
        id:
          type: string
          pattern: '^op-[0-9a-hjkmnp-tv-z]{12}$'
        type:
          $ref: '#/components/schemas/OperationType'
        resource:
          type: object
          required: [grn]
          description: 작업 대상. 서비스 자원은 GRN, 하위 자원(스냅샷·백업)은 하위 자원 표기다
          properties:
            grn:
              type: string
        status:
          $ref: '#/components/schemas/OperationStatus'
        stage:
          $ref: '#/components/schemas/OperationStage'
        queue_position:
          type: integer
          minimum: 0
          description: '`queued`일 때 앞에 기다리는 작업 수. 그 밖에는 0'
        error:
          description: '`failed`일 때만 값이 있다. 그 밖에는 null (위 `oneOf`로 강제한다)'
          oneOf:
            - $ref: '#/components/schemas/OperationError'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
          description: 끝난 시각. 진행 중이면 null. 끝난 operation은 이 시각부터 30일 동안 조회할 수 있고, 그 뒤에는 404다
    OperationRef:
      type: object
      description: |
        `202` 응답의 `operation` 칸. 각 자원 명세(`database.yaml`, `app.yaml` …)가 이 모양을 가리킨다.
        나머지 값은 `GET /api/v2/operations/{operation_id}`로 받는다
      required: [id, type, status, stage]
      properties:
        id:
          type: string
          pattern: '^op-[0-9a-hjkmnp-tv-z]{12}$'
        type:
          $ref: '#/components/schemas/OperationType'
        status:
          $ref: '#/components/schemas/OperationStatus'
        stage:
          $ref: '#/components/schemas/OperationStage'
