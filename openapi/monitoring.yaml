openapi: 3.1.0
info:
  title: GSMSV v2 Monitoring API
  version: 0.1.0
  description: |
    알림 확인(9.1~9.6)과 관리자 인프라 현황(11.13~11.15). 서비스 상태 공개(28번)는 GSMSV 밖의 상태 페이지가 맡으므로 이 파일에 없다.

    - 규칙의 원본은 [22번 권한 판단](../rules/authorization.md)이다
    - JSON 칸 이름은 snake_case, enum 값은 소문자다
    - 오류 본문은 공통 형식 `{ code, message, request_id, details? }`다. 아래에 적지 않은 공통 오류(400·401·404)도 모든 API에 해당한다
    - 알림은 모두 본인 것만 다룬다. 남의 알림은 존재를 숨기려고 403이 아니라 404 `RESOURCE_NOT_FOUND`로 답한다
    - 관리자 API는 관리자만 부른다. 노드 이름·`vmid`처럼 구현 값을 응답에 넣는 예외가 여기에만 있다

    모니터링 API가 쓰는 오류 `code`

    | 상태 | code | 뜻 |
    |---|---|---|
    | 400 | `LOCKED_CATEGORY` | 끌 수 없는 필수 알림을 끄려 했다. `details.groups[]`에 그룹 이름 |
    | 403 | `ACCESS_DENIED` | 관리자가 아니다 |
    | 503 | `UPSTREAM_UNAVAILABLE` | 그 노드가 응답하지 않는다 |
servers:
  - url: https://{host}
    variables:
      host:
        default: example.com
security:
  - accessToken: []
tags:
  - name: Notification
    description: 알림 확인
  - name: Notification Settings
    description: 알림 설정
  - name: Admin Infra
    description: 관리자 인프라 현황
paths:
  /api/v2/notifications:
    get:
      tags: [Notification]
      operationId: listNotifications
      summary: 알림 목록 (9.1)
      description: |
        최근 알림을 최대 50건 준다. 50건 상한이라 페이지를 나누지 않는다.

        권한: 본인
      responses:
        '200':
          description: 알림 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
              example:
                items:
                  - id: ntf-4k8m2q9t
                    kind: warning
                    category: db_storage_80
                    group: usage
                    title: DB 용량이 80%에 도달했습니다
                    body: 주문 서비스 DB가 한도의 80%를 썼습니다.
                    resource: { grn: 'grn:team-4p8w2k9m1xza:db-k3m9x2p7q4ta', name: 주문 서비스 DB }
                    read: false
                    created_at: '2026-11-10T09:00:00Z'
                unread_count: 1
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthenticated'
  /api/v2/notifications/read-all:
    post:
      tags: [Notification]
      operationId: markAllNotificationsRead
      summary: 모두 읽음 처리 (9.3)
      description: |
        0건이어도 성공이다. 처리한 건수는 알려 주지 않는다.

        권한: 본인
      responses:
        '204':
          description: 처리했다
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthenticated'
  /api/v2/notifications/{notification_id}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [Notification]
      operationId: markNotificationRead
      summary: 알림 읽음 처리 (9.2)
      description: |
        이미 읽은 알림에 다시 보내도 성공이다.

        권한: 본인
      responses:
        '204':
          description: 처리했다
        '400':
          $ref: './components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
  /api/v2/notifications/{notification_id}:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    delete:
      tags: [Notification]
      operationId: deleteNotification
      summary: 알림 삭제 (9.4)
      description: |
        권한: 본인
      responses:
        '204':
          description: 지웠다
        '400':
          $ref: './components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
  /api/v2/users/me/notification-settings:
    get:
      tags: [Notification Settings]
      operationId: getNotificationSettings
      summary: 알림 설정 조회 (9.5)
      description: |
        채널 연결 상태와 그룹별 켜기/끄기를 준다. 끌 수 없는 필수 알림은 `locked: true`다.

        권한: 본인
      responses:
        '200':
          description: 알림 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
              example:
                channels:
                  email: student@example.com
                  discord: { connected: false }
                items:
                  - { group: expiry, email: true, discord: true, locked: true }
                  - { group: usage, email: true, discord: false, locked: false }
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthenticated'
    put:
      tags: [Notification Settings]
      operationId: updateNotificationSettings
      summary: 알림 설정 바꾸기 (9.6)
      description: |
        원하는 상태를 통째로 보낸다. 필수 알림을 끄려 하면 요청 전체를 400 `LOCKED_CATEGORY`로 거절한다
        (일부만 조용히 무시하지 않는다). 켜 둔 값 그대로 보내는 것은 허용한다.
        Discord가 연결되지 않아도 값은 저장하고, 연결되면 그때부터 보낸다. 없는 `group`이면 400 `VALIDATION_FAILED`다.

        권한: 본인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationSettingsRequest'
            example:
              items:
                - { group: expiry, email: true, discord: true }
                - { group: usage, email: false, discord: false }
      responses:
        '200':
          description: 바꿨다
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationSettingItem'
        '400':
          $ref: './components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthenticated'
  /api/v2/admin/infra/nodes:
    get:
      tags: [Admin Infra]
      operationId: listInfraNodes
      summary: 노드 자원 현황 (11.13)
      description: |
        노드마다 사용량과 할당 현황을 준다. 조회가 실패한 노드는 오류가 아니라 `online: false`로 표시한다.

        권한: 관리자
      responses:
        '200':
          description: 노드 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InfraNode'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
  /api/v2/admin/resources:
    get:
      tags: [Admin Infra]
      operationId: listAdminResources
      summary: 전체 자원 목록 (11.14)
      description: |
        DB 기준으로 전체 자원을 준다.

        권한: 관리자
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [vm, fn, db, app]
        - name: node
          in: query
          required: false
          description: VM만 거를 수 있다
          schema:
            type: string
        - name: owner
          in: query
          required: false
          description: '`user-…` 또는 `team-…`'
          schema:
            type: string
        - $ref: './components/common.yaml#/components/parameters/Cursor'
        - $ref: './components/common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: 자원 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResourcePage'
        '400':
          $ref: './components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
  /api/v2/admin/infra/nodes/{node}/vms:
    parameters:
      - name: node
        in: path
        required: true
        description: 노드 이름
        schema:
          type: string
    get:
      tags: [Admin Infra]
      operationId: listNodeVms
      summary: 노드별 VM 목록 (11.15)
      description: |
        가상화 서버 기준으로 그 노드의 VM을 준다. DB에 없는 고아 VM도 나온다.

        권한: 관리자
      responses:
        '200':
          description: VM 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NodeVm'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
        '503':
          description: 그 노드가 응답하지 않는다 (`UPSTREAM_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: './components/common.yaml#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    accessToken:
      $ref: './components/common.yaml#/components/securitySchemes/accessToken'
  parameters:
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ntf-[0-9a-hjkmnp-tv-z]{8}$'
      example: ntf-4k8m2q9t
  schemas:
    Notification:
      type: object
      required: [id, kind, category, group, title, body, resource, read, created_at]
      properties:
        id: { type: string, pattern: '^ntf-[0-9a-hjkmnp-tv-z]{8}$' }
        kind:
          type: string
          description: 알림의 성격 (예 `info`, `warning`). 값 목록은 후속 계약에서 확정한다
        category:
          type: string
          description: 세부 종류. `group`으로 묶인다
        group:
          type: string
          description: 설정 단위. `category`와 `group`의 매핑 표는 제안이다
        title: { type: string }
        body: { type: string }
        resource:
          type: [object, 'null']
          required: [grn, name]
          properties:
            grn: { type: string }
            name: { type: string }
        read: { type: boolean }
        created_at: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [items, unread_count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unread_count: { type: integer }
    NotificationSettingItem:
      type: object
      required: [group, email, discord, locked]
      properties:
        group: { type: string }
        email: { type: boolean }
        discord: { type: boolean }
        locked:
          type: boolean
          description: 필수 알림이라 끌 수 없다
    NotificationSettings:
      type: object
      required: [channels, items]
      properties:
        channels:
          type: object
          required: [email, discord]
          properties:
            email: { type: string }
            discord:
              type: object
              required: [connected]
              properties:
                connected: { type: boolean }
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationSettingItem'
    UpdateNotificationSettingsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [group, email, discord]
            properties:
              group: { type: string }
              email: { type: boolean }
              discord: { type: boolean }
    Allocation:
      type: object
      required: [allocated, allocatable]
      properties:
        allocated: { type: number }
        allocatable: { type: number }
    InfraNode:
      type: object
      required: [node, online, usage, allocation, clone_queue_length]
      properties:
        node: { type: string }
        online: { type: boolean }
        usage:
          type: object
          required: [cpu_percent, memory_used_gb, memory_total_gb, uptime_sec]
          properties:
            cpu_percent: { type: number }
            memory_used_gb: { type: number }
            memory_total_gb: { type: number }
            uptime_sec: { type: integer }
        allocation:
          type: object
          required: [vcpu, ram_gb, ssd_gb]
          properties:
            vcpu: { $ref: '#/components/schemas/Allocation' }
            ram_gb: { $ref: '#/components/schemas/Allocation' }
            ssd_gb: { $ref: '#/components/schemas/Allocation' }
        clone_queue_length: { type: integer }
    AdminResource:
      type: object
      required: [grn, type, name, owner_email, status]
      properties:
        grn: { type: string }
        type: { type: string, enum: [vm, fn, db, app] }
        name: { type: string }
        node: { type: [string, 'null'], description: VM만 준다 }
        vmid: { type: [integer, 'null'], description: VM만 준다 }
        owner_email: { type: string }
        status: { type: string }
        power_state: { type: [string, 'null'], description: VM만 준다 }
    AdminResourcePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminResource'
        next_cursor:
          type: [string, 'null']
    NodeVm:
      type: object
      required: [vmid, proxmox_name, classification, grn]
      properties:
        vmid: { type: integer }
        proxmox_name: { type: string }
        classification:
          type: string
          enum: [managed, orphan, unmanaged]
          description: GSMSV가 관리하는 VM / DB에 없는 고아 VM / GSMSV와 상관없는 VM
        grn:
          type: [string, 'null']
          description: 관리하는 VM만 준다
