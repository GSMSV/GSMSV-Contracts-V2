openapi: 3.1.0
info:
  title: GSMSV v2 Internal API (Server → Infra)
  version: 0.1.0
  description: |
    API 서버(Kotlin, GSMSV-Server-V2)가 실행 엔진(Go, GSMSV-Infra-V2)을 부르는 내부 API다. 브라우저는 이 API에 닿지 않는다.

    - 공통 규약의 원본은 [내부 API 공통 규약](../rules/internal-api-rules.md)이다. 이 파일과 규약이 다르면 규약이 맞다
    - 이 파일에는 공통 부품(헤더·오류·작업)과 헬스 체크, 작업 조회, 노드 조회(13.8, 11.15용), 네트워크 맞추기(13.6·13.7)만 있다. 다른 엔드포인트는 Go 구현 전에 기능마다 PR로 더한다 (계약 먼저)
    - 서비스 사이 인증은 모든 요청에 걸린다. 방식과 자격증명은 이 저장소에 쓰지 않는다 ([Kotlin·Go 경계](../policies/kotlin-go-boundary.md) 6.5). 인증에 실패하면 401 `UNAUTHENTICATED`다
    - HTTP/1.1 + JSON이다. JSON 칸 이름은 snake_case, enum 값은 소문자다. 오류 `code`만 대문자다
    - 받는 쪽은 모르는 칸을 무시한다. 선택 칸은 `null`과 칸이 없는 것을 같은 뜻으로 받는다
    - 자원은 자원 id(`vm-…`, `port-…`, `domain-…`)로 가리킨다. GRN은 쓰지 않는다
    - 모든 예시 값은 가짜 값이다 (주소는 RFC 5737 대역, 도메인은 `example.com`)
servers:
  - url: http://{host}
    description: 실제 주소는 운영 정보라 쓰지 않는다
    variables:
      host:
        default: infra.example.com
tags:
  - name: Health
    description: 살아 있는지, 외부 시스템에 닿는지
  - name: Job
    description: 오래 걸리는 작업의 상태 조회와 취소
  - name: Node
    description: 노드의 총량·실사용량·클론 대기 줄과 노드에 실제로 있는 VM 조회
  - name: Network
    description: VM 포트 집합과 HTTPS 라우트 맞추기 (선언형)
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 프로세스가 요청을 받을 수 있는지
      description: |
        외부 시스템(Proxmox·게이트웨이·Caddy·Kubernetes)을 보지 않고 바로 답한다. 인증 없이 부를 수 있다.
        `boot_id`는 프로세스가 뜰 때마다 새로 정하는 값이다. 바뀌었으면 Infra가 다시 떴다는 뜻이고, Server는 선언형 상태를 모두 다시 보낸다 (규약 7장).
      security: []
      responses:
        '200':
          description: 살아 있다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: up
                boot_id: boot-k3m9x2p7q4ta
  /readyz:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 외부 시스템에 닿는지
      description: |
        외부 시스템마다 닿는지를 확인해 답한다. 하나라도 닿지 않으면 503이다. 인증 없이 부를 수 있다.
        본문에 주소·노드 이름·장비 정보를 넣지 않는다.
      security: []
      responses:
        '200':
          description: 모두 닿는다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: up
                checks: { proxmox: up, gateway: up, caddy: up, kubernetes: up }
        '503':
          description: 닿지 않는 외부 시스템이 있다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: down
                checks: { proxmox: up, gateway: down, caddy: up, kubernetes: up }
  /jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Job]
      operationId: getJob
      summary: 작업 상태 (13.10)
      description: |
        Server가 폴링한다. 끝난 작업은 끝난 뒤 1시간 이상 남긴다. Infra가 다시 뜨면 작업 기록은 사라진다.
        404를 받으면 Server는 대상 자원의 실제 상태를 Infra에 물어 복구한다 (규약 4.2).
      responses:
        '200':
          description: 작업 상태
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                running:
                  value:
                    job_id: job-5f6g7h8j9k2m
                    type: vm.create
                    resource_id: vm-k3m9x2p7q4ta
                    status: running
                    stage: cloning
                    queue_position: 0
                    created_at: '2026-11-12T09:00:00Z'
                    updated_at: '2026-11-12T09:00:20Z'
                    error: null
                failed:
                  value:
                    job_id: job-5f6g7h8j9k2m
                    type: vm.create
                    resource_id: vm-k3m9x2p7q4ta
                    status: failed
                    stage: cloning
                    queue_position: 0
                    created_at: '2026-11-12T09:00:00Z'
                    updated_at: '2026-11-12T09:01:05Z'
                    error:
                      code: VMID_TAKEN
                      retryable: false
                      details: { vmid: 101 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /jobs/{job_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Job]
      operationId: cancelJob
      summary: 작업 취소
      description: |
        `queued`면 바로 `canceled`가 된다. `running`이면 다음 단계로 넘어가기 전에 멈추고 만들다 만 것을 정리한 뒤 `canceled`가 된다.
        이미 끝난 작업이면 아무것도 하지 않고 현재 상태를 준다. 여러 번 불러도 결과가 같다.
      responses:
        '202':
          description: 취소를 받았다. 결과는 작업 상태 조회로 확인한다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /nodes:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Node]
      operationId: listNodes
      summary: 노드 현황 (13.8)
      description: |
        Infra가 맡은 노드 전부의 총량·실사용량·클론 대기 줄 길이를 준다. Server가 노드를 고를 때(VM 만들기·사양 바꾸기)와 관리자 노드 현황(11.13)에 쓴다.

        - **여유(할당 기준)는 주지 않는다.** 할당 합계는 Server DB에 있고 할당 상한(RAM 1배, CPU 2배, SSD 풀의 80%)은 Server의 할당량 정책이다 ([27번](../policies/quota.md) 1장). Server가 `total`과 DB의 할당 합계로 계산한다 ([경계 4장 레드라인](../policies/kotlin-go-boundary.md#레드라인--go에-넣지-않는-것): 할당량 계산·노드 선택은 Go에 넣지 않는다)
        - 값은 상태 캐시에서 준다. 캐시가 10초 이내면 그대로 주고, 오래됐으면 그때 한 번 묻는다 ([경계 7.4](../policies/kotlin-go-boundary.md#74-상태-캐시)). `refresh=true`면 캐시를 무시하고 바로 묻는다 (VM 만들기 직전처럼 정확도가 중요할 때)
        - 닿지 않는 노드도 목록에 넣고 `online: false`로 준다. 이때 `total`·`usage`·`configured`는 `null`이다. 노드 하나가 닿지 않는다고 전체를 실패로 답하지 않는다
        - `clone_queue_length`는 Infra 메모리의 값이라 노드가 닿지 않아도 준다
        - 노드마다 API가 따로 있고(하나의 클러스터로 묶여 있지 않다) 노드 목록은 Infra 설정(맡은 노드)에서 나온다. 그래서 모든 노드에 닿지 않을 때도 200과 함께 전부 `online: false`로 주고, 이 엔드포인트는 503을 쓰지 않는다. Infra는 노드마다 동시에 묻고, 응답 시간 안에 답하지 않은 노드는 `online: false`로 넣는다
      parameters:
        - name: refresh
          in: query
          required: false
          description: '`true`면 캐시를 무시하고 바로 묻는다. 빠지면 `false`'
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 노드 목록
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'
              example:
                items:
                  - node: node-a
                    online: true
                    observed_at: '2026-11-12T09:00:05Z'
                    total:
                      cpu_cores: 16
                      cpu_threads: 32
                      memory_mb: 131072
                      ssd_gb: 1800
                    usage:
                      cpu_percent: 23.5
                      memory_used_mb: 61440
                      uptime_sec: 1209600
                    configured:
                      vcpu: 40
                      memory_mb: 98304
                      ssd_gb: 1100
                    clone_queue_length: 2
                  - node: node-b
                    online: false
                    observed_at: '2026-11-12T09:00:05Z'
                    total: null
                    usage: null
                    configured: null
                    clone_queue_length: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /nodes/{node}/vms:
    parameters:
      - $ref: '#/components/parameters/NodeName'
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Node]
      operationId: listNodeVms
      summary: 노드별 VM 목록 (11.15용)
      description: |
        그 노드에 **실제로 있는** VM을 준다. 관리 밖 VM과 템플릿도 모두 넣는다. 캐시를 쓰지 않고 바로 묻는다 (고아 VM을 찾는 데 쓰므로 지금 값이어야 한다).

        - 관리 여부(`managed`/`orphan`/`unmanaged`)는 Infra가 정하지 않는다. Server가 `name`을 VM id 형식으로 검사하고 DB와 비교해 정한다 (Infra는 DB를 보지 않는다, 규약 1장)
        - `name`은 Proxmox VM 이름 그대로다. GSMSV가 만든 VM이면 `vm_id`와 같다 (규약 2.1)
        - 노드가 Infra가 맡은 노드가 아니면 404 `RESOURCE_NOT_FOUND`, 그 노드가 응답하지 않으면 503 `UPSTREAM_UNAVAILABLE`이다
      responses:
        '200':
          description: 그 노드의 VM 목록
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeVmList'
              example:
                node: node-a
                observed_at: '2026-11-12T09:00:05Z'
                items:
                  - vmid: 101
                    name: vm-k3m9x2p7q4ta
                    template: false
                  - vmid: 102
                    name: vm-7p2q9x4m3kta
                    template: false
                  - vmid: 9000
                    name: ubuntu-template
                    template: true
                  - vmid: 150
                    name: monitoring
                    template: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /network/vms/{vm_id}/ports:
    parameters:
      - $ref: '#/components/parameters/VmId'
      - $ref: '#/components/parameters/RequestId'
    put:
      tags: [Network]
      operationId: syncVmPorts
      summary: VM 포트 집합 맞추기 (13.6)
      description: |
        이 VM의 포트 규칙 전체를 보낸다. Infra는 게이트웨이의 현재 규칙과 비교해 차이만 적용하고, 목록에 없는 이 VM의 규칙은 지운다.
        `ports`가 비어 있으면 이 VM의 규칙을 모두 지운다 (VM 삭제 때). 규칙에는 `vm-…`·`port-…` id를 적어 둔다.
        같은 VM에 대한 요청은 Infra 안에서 하나씩 차례로 처리한다. 같은 본문을 여러 번 보내도 결과가 같다.
        반영에 실패하면 2xx가 아닌 상태로 답한다. 200이면 `applied`는 항상 `true`다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmPortsRequest'
            example:
              internal_ip: 192.0.2.23
              ports:
                - id: port-5q8w3n7z
                  external: 40001
                  internal: 22
                  protocol: tcp
                  allowed_source: null
                - id: port-2x7c5v9b
                  external: 40002
                  internal: 8080
                  protocol: tcp
                  allowed_source: 203.0.113.0/24
      responses:
        '200':
          description: 반영했다
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortSyncResult'
              example:
                applied: true
                added: 1
                removed: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /https/routes:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    put:
      tags: [Network]
      operationId: syncHttpsRoutes
      summary: HTTPS 라우트 맞추기 (13.7)
      description: |
        활성 도메인 연결 **전체**로 만든 라우트 목록을 보낸다 ([23번 9장](../rules/resource-naming.md#9-https-도메인-연결의-인프라-부품)).
        Infra는 Caddy의 사용자 라우트를 이 목록으로 한 번에 교체하고, 실패하면 이전 설정을 그대로 둔다.
        사용자 라우트는 캐치올 라우트보다 앞에 둔다. 라우트의 id는 `domain-…`이다.
        라우트 목록 전체에 대한 요청은 Infra 안에서 하나씩 차례로 처리한다. 200이면 `applied`는 항상 `true`다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HttpsRoutesRequest'
            example:
              routes:
                - id: domain-4k8m2q9t
                  host: my-app.example.com
                  upstream: 192.0.2.23:8080
      responses:
        '200':
          description: 반영했다
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteSyncResult'
              example:
                applied: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
components:
  headers:
    RequestId:
      description: 요청에 실려 온 `X-Request-Id`를 그대로 돌려준다. 없었으면 Infra가 만든 값이다
      schema:
        type: string
        pattern: '^req-[A-Za-z0-9_-]{1,64}$'
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Server의 요청 id를 그대로 싣는다. Infra는 로그에 `request_id`로 남기고, 응답 헤더와 오류 본문에 같은 값을 넣는다.
        Server는 항상 싣는다. 없거나 형식이 틀리면 Infra가 같은 형식으로 새로 만든다 (거절하지 않는다)
      schema:
        type: string
        pattern: '^req-[A-Za-z0-9_-]{1,64}$'
      example: req-3f2a9c1e7b6d4a58b0e2c4d6f8a1b3c5
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        명령형 작업 요청(VM 만들기·지우기·전원·사양·스냅샷)에 필수다. Server는 그 작업의 operation id(`op-…`)를 싣는다.
        같은 키로 다시 오면 Infra는 새로 실행하지 않고 처음 작업을 202로 다시 준다. 같은 키에 본문이 다르면 422 `IDEMPOTENCY_KEY_REUSED`다
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
      example: op-7w8k9q0p1a2s
    JobId:
      name: job_id
      in: path
      required: true
      description: Infra가 정한 작업 id. Server는 해석하지 않고 그대로 저장·전달한다
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
      example: job-5f6g7h8j9k2m
    NodeName:
      name: node
      in: path
      required: true
      description: |
        Proxmox 노드 이름. 자원 id가 아니라 Infra가 맡은 노드의 이름이다 (규약 2.1). 형식이 틀리면 400 `INVALID_REQUEST`다.
        실제 노드 이름은 운영 정보라 예시에 쓰지 않는다
      schema:
        type: string
        pattern: '^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$'
      example: node-a
    VmId:
      name: vm_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^vm-[0-9a-hjkmnp-tv-z]{12}$'
      example: vm-k3m9x2p7q4ta
  schemas:
    InternalError:
      type: object
      required: [code, retryable, request_id]
      description: Infra의 모든 오류 응답 본문. 사람이 읽을 문장은 넣지 않는다 (규약 5장)
      properties:
        code:
          type: string
          description: 오류 종류. 대문자와 밑줄. 목록은 규약 5.3
          example: VMID_TAKEN
        retryable:
          type: boolean
          description: 같은 요청을 그대로 다시 보내도 되는지
        details:
          type: object
          additionalProperties: true
          description: 원인 데이터. 웹 API 오류의 `details`와 같은 칸 이름이다. 비밀값·자격증명은 넣지 않는다. 없으면 빠진다
        request_id:
          type: string
    JobError:
      type: object
      required: [code, retryable]
      description: 실패한 작업의 원인. `InternalError`에서 `request_id`만 뺀 모양이다. 정리까지 실패했으면 `details.cleanup`이 `failed`다
      properties:
        code: { type: string }
        retryable: { type: boolean }
        details:
          type: object
          additionalProperties: true
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
    Job:
      type: object
      required: [job_id, type, resource_id, status, stage, queue_position, created_at, updated_at]
      properties:
        job_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        type:
          type: string
          description: 작업 종류. Server operation의 `type`과 같은 이름을 쓴다 (예 `vm.create`, `vm.delete`, `vm.power`, `vm.resize`, `snap.create`, `snap.delete`, `snap.restore`)
        resource_id:
          type: string
          description: 작업 대상 자원 id
        status:
          $ref: '#/components/schemas/JobStatus'
        stage:
          type: string
          description: 지금 단계. VM 만들기는 `queued` → `cloning` → `configuring` → `booting` → `networking`. 그 밖의 작업은 `queued` → `running`. 끝난 작업은 마지막 단계를 그대로 둔다
        queue_position:
          type: integer
          minimum: 0
          description: '`queued`일 때 앞에 기다리는 작업 수. 그 밖에는 0'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        error:
          oneOf:
            - $ref: '#/components/schemas/JobError'
            - type: 'null'
          description: '`failed`일 때만 값이 있다'
    JobAccepted:
      type: object
      required: [job_id, status, queue_position]
      description: 명령형 작업 요청을 받았을 때의 202 본문
      properties:
        job_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        status:
          $ref: '#/components/schemas/JobStatus'
        queue_position:
          type: integer
          minimum: 0
    Health:
      type: object
      required: [status, boot_id]
      properties:
        status:
          type: string
          enum: [up]
        boot_id:
          type: string
          description: 프로세스가 뜰 때마다 새로 정하는 값. Server는 바뀌었는지만 본다
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [up, down]
        checks:
          type: object
          description: 외부 시스템마다 `up` 또는 `down`. 이름에 주소·노드 이름을 넣지 않는다
          additionalProperties:
            type: string
            enum: [up, down]
    NodeTotal:
      type: object
      required: [cpu_cores, cpu_threads, memory_mb, ssd_gb]
      description: 노드의 물리 총량. 할당 상한(배수)을 곱하기 전의 값이다
      properties:
        cpu_cores:
          type: integer
          minimum: 0
          description: 물리 코어 수 (Proxmox 노드 상태 `cpuinfo`의 `cores`). CPU 할당 상한(물리 코어 수의 2배)은 이 값에 곱한다 (27번 1장)
        cpu_threads:
          type: integer
          minimum: 0
          description: 논리 스레드 수 (`cpuinfo`의 `cpus`). 하이퍼스레딩이 켜져 있으면 `cpu_cores`의 2배다. 참고용이고 할당 상한에는 쓰지 않는다
        memory_mb:
          type: integer
          minimum: 0
          description: 물리 메모리 (MiB)
        ssd_gb:
          type: integer
          minimum: 0
          description: VM 디스크를 두는 저장소 풀의 크기 (GiB). 어느 풀인지는 Infra 설정이다
    NodeUsage:
      type: object
      required: [cpu_percent, memory_used_mb, uptime_sec]
      description: 노드의 실사용량 (Proxmox가 모아 둔 값)
      properties:
        cpu_percent:
          type: number
          minimum: 0
          maximum: 100
          description: 노드 전체 CPU 사용률 (%). 소수 첫째 자리까지
        memory_used_mb:
          type: integer
          minimum: 0
          description: 사용 중인 메모리 (MiB)
        uptime_sec:
          type: integer
          minimum: 0
          description: 노드가 켜진 뒤 지난 시간 (초)
    NodeConfigured:
      type: object
      required: [vcpu, memory_mb, ssd_gb]
      description: |
        그 노드에 있는 **모든 VM**(관리 밖 VM 포함)의 설정 사양 합계 (Proxmox VM 목록의 `maxcpu`·`maxmem`·`maxdisk`). 꺼진 VM도 넣는다 (27번 1장과 같은 기준). 템플릿은 `ssd_gb`에만 넣고 `vcpu`·`memory_mb`에서는 뺀다.
        Server는 이 값에서 그 노드에 있는 DB 관리 VM의 합계를 빼 관리 밖 VM(운영 인프라 등)의 몫을 구하고, 노드 여유에서 뺀다
      properties:
        vcpu:
          type: integer
          minimum: 0
        memory_mb:
          type: integer
          minimum: 0
          description: MiB
        ssd_gb:
          type: integer
          minimum: 0
          description: GiB
    NodeStatus:
      type: object
      required: [node, online, observed_at, total, usage, configured, clone_queue_length]
      properties:
        node:
          type: string
          description: Proxmox 노드 이름
        online:
          type: boolean
          description: Infra가 이 노드에 닿았는지. `false`면 `total`·`usage`·`configured`가 `null`이다
        observed_at:
          type: string
          format: date-time
          description: 이 값을 Proxmox에서 받은 시각 (캐시 값이면 받아 둔 시각)
        total:
          oneOf:
            - $ref: '#/components/schemas/NodeTotal'
            - type: 'null'
        usage:
          oneOf:
            - $ref: '#/components/schemas/NodeUsage'
            - type: 'null'
        configured:
          oneOf:
            - $ref: '#/components/schemas/NodeConfigured'
            - type: 'null'
        clone_queue_length:
          type: integer
          minimum: 0
          description: 이 노드의 클론 줄에서 기다리는 작업 수. 지금 클론 중인 작업은 세지 않는다 (`Job.queue_position`과 같은 기준)
    NodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NodeStatus'
    NodeVm:
      type: object
      required: [vmid, name, template]
      properties:
        vmid:
          type: integer
          minimum: 1
          description: Proxmox VM 번호. 노드끼리 겹칠 수 있다
        name:
          type: string
          description: Proxmox VM 이름 그대로. GSMSV가 만든 VM이면 `vm_id`다. 이름이 없으면 빈 문자열이다
        template:
          type: boolean
          description: 템플릿인지
    NodeVmList:
      type: object
      required: [node, observed_at, items]
      properties:
        node:
          type: string
        observed_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/NodeVm'
    Protocol:
      type: string
      enum: [tcp, udp]
    VmPortRule:
      type: object
      required: [id, external, internal, protocol]
      properties:
        id:
          type: string
          pattern: '^port-[0-9a-hjkmnp-tv-z]{8}$'
        external:
          type: integer
          minimum: 1
          maximum: 65535
          description: 외부 포트. 고르는 규칙은 인프라 담당이 비공개 문서로 정한다
        internal:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          $ref: '#/components/schemas/Protocol'
        allowed_source:
          type: [string, 'null']
          description: 허용할 출발 IP 또는 CIDR. `null`이거나 빠지면 모두 허용
    VmPortsRequest:
      type: object
      required: [internal_ip, ports]
      properties:
        internal_ip:
          type: string
          description: 이 VM의 내부 IP (IPv4)
        ports:
          type: array
          items:
            $ref: '#/components/schemas/VmPortRule'
    PortSyncResult:
      type: object
      required: [applied, added, removed]
      properties:
        applied:
          type: boolean
          description: 200이면 항상 `true`
        added:
          type: integer
          minimum: 0
          description: 새로 넣은 규칙 수
        removed:
          type: integer
          minimum: 0
          description: 지운 규칙 수
    HttpsRoute:
      type: object
      required: [id, host, upstream]
      properties:
        id:
          type: string
          pattern: '^domain-[0-9a-hjkmnp-tv-z]{8}$'
        host:
          type: string
          description: 연결할 전체 도메인 이름
        upstream:
          type: string
          description: '보낼 곳. `{내부 IP}:{포트}`'
    HttpsRoutesRequest:
      type: object
      required: [routes]
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/HttpsRoute'
    RouteSyncResult:
      type: object
      required: [applied]
      properties:
        applied:
          type: boolean
          description: 200이면 항상 `true`
  responses:
    BadRequest:
      description: |
        요청 형식 오류. `code`는 `INVALID_REQUEST`(JSON·필수 칸·값 범위) 또는 `INVALID_RESOURCE_ID`(id 형식)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
    Unauthenticated:
      description: 서비스 사이 인증에 실패했다 (`UNAUTHENTICATED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
    NotFound:
      description: Infra가 대상을 찾지 못했다 (`RESOURCE_NOT_FOUND`, `JOB_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
    Conflict:
      description: 다른 것과 부딪혀 적용할 수 없다 (`ALREADY_EXISTS`, `VMID_TAKEN`, `PORT_TAKEN`, `INVALID_STATE`). `retryable`은 `false`다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
    Internal:
      description: Infra 안의 예상하지 못한 오류 (`INTERNAL`). `retryable`은 `false`다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
    UpstreamUnavailable:
      description: Proxmox·게이트웨이·Caddy·Kubernetes가 응답하지 않는다 (`UPSTREAM_UNAVAILABLE`). `retryable`은 `true`다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
    UpstreamTimeout:
      description: Infra 안에서 시간 안에 끝내지 못했다 (`UPSTREAM_TIMEOUT`). `retryable`은 `true`다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
